name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 20 is the declared floor in engines; 22 and 24 are the supported lines.
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: rust toolchain (the rust oracle needs the compiler)
        run: |
          rustup toolchain install stable --profile minimal || true
          rustc --version
      - run: npm ci
      - run: npm run check
      - run: npm run dead-code
      - name: test (no oracle may skip in CI)
        run: |
          set -o pipefail
          npm test -- --test-reporter=spec 2>&1 | tee /tmp/test.log
          grep -q 'ℹ skipped 0' /tmp/test.log
