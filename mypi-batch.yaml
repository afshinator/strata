# Batch policy — read by `mypi-batch prepare`, never written by it.
# The code-fix template ships with the driver, so the relative path resolves there (#287).
version: 1

prepare:
  # Mirror of the driver's kind catalog (multi-agent/mypi-batch.yaml). Triage answers
  # KIND from this list and the value is validated against it, so a kind missing here
  # cannot be chosen at all.
  kinds: [code-fix, code-small, writer, writer-solo]
  kind_templates:
    code-fix: templates/batch-code-fix.yaml
    code-small: templates/code-small.yaml
    writer: templates/writer.yaml
    writer-solo: templates/writer-solo.yaml
  triage_model: commandcode/deepseek/deepseek-v4-pro
  verifier_model: commandcode/gpt-6-luna
  agent_timeout_minutes: 30

run:
  timeout_minutes: 30
